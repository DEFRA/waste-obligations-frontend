version: '3.4'
services:
  localstack:
    image: localstack/localstack:3.0.2
    ports:
      - '4566:4566' # LocalStack Gateway
      - '4510-4559:4510-4559' # external services port range
    env_file:
      - 'compose/aws.env'
    environment:
      DEBUG: ${DEBUG:-1}
      LS_LOG: WARN # Localstack DEBUG Level
      SERVICES: s3,sqs,sns,firehose
      LOCALSTACK_HOST: 127.0.0.1
    volumes:
      - '${TMPDIR:-/tmp}/localstack:/var/lib/localstack'
      - ./compose/start-localstack.sh:/etc/localstack/init/ready.d/start-localstack.sh
    healthcheck:
      test: ['CMD', 'curl', 'localhost:4566']
      interval: 5s
      start_period: 5s
      retries: 3
    networks:
      - cdp-tenant

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    restart: always
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:7.0.2
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data
    restart: always

  wiremock:
    pull_policy: if_not_present
    image: sheyenrath/wiremock.net:latest
    ports:
      - '9080:80'
    volumes:
      - ./compose/wiremock/mappings:/app/__admin/mappings
    command:
      [
        '--ReadStaticMappings',
        'true',
        '--WatchStaticMappingsInSubdirectories',
        'true',
        '--WireMockLogger',
        'WireMockConsoleLogger'
      ]
    networks:
      - cdp-tenant

  ################################################################################

  waste-obligations-frontend:
    build: ./
    ports:
      - '3000:3000'
    links:
      - 'localstack:localstack'
      - 'redis:redis'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_started
      wiremock:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3000
      NODE_ENV: development
      REDIS_HOST: redis
      LOCALSTACK_ENDPOINT: http://localstack:4566
      USE_SINGLE_INSTANCE_CACHE: true
      WASTE_ORGANISATIONS_API_BASE_URL: ${WASTE_ORGANISATIONS_API_BASE_URL:-http://wiremock}
      WASTE_ORGANISATIONS_API_AUTH_MODE: ${WASTE_ORGANISATIONS_API_AUTH_MODE:-basic}
      WASTE_ORGANISATIONS_API_CLIENT_ID: ${WASTE_ORGANISATIONS_API_CLIENT_ID:-Developer}
      WASTE_ORGANISATIONS_API_CLIENT_SECRET: ${WASTE_ORGANISATIONS_API_CLIENT_SECRET:-developer-pwd}
      WASTE_OBLIGATIONS_API_BASE_URL: ${WASTE_OBLIGATIONS_API_BASE_URL:-http://wiremock}
      WASTE_OBLIGATIONS_API_AUTH_MODE: ${WASTE_OBLIGATIONS_API_AUTH_MODE:-basic}
      WASTE_OBLIGATIONS_API_CLIENT_ID: ${WASTE_OBLIGATIONS_API_CLIENT_ID:-Developer}
      WASTE_OBLIGATIONS_API_CLIENT_SECRET: ${WASTE_OBLIGATIONS_API_CLIENT_SECRET:-developer-pwd}
      BACKEND_ACCOUNT_API_BASE_URL: ${BACKEND_ACCOUNT_API_BASE_URL:-http://wiremock/api/}
      BACKEND_ACCOUNT_API_AUTH_MODE: ${BACKEND_ACCOUNT_API_AUTH_MODE:-bearer}
      BACKEND_ACCOUNT_API_OAUTH_CLIENT_ID: ${BACKEND_ACCOUNT_API_OAUTH_CLIENT_ID:-waste-obligations-frontend}
      BACKEND_ACCOUNT_API_OAUTH_CLIENT_SECRET: ${BACKEND_ACCOUNT_API_OAUTH_CLIENT_SECRET:-waste-obligations-frontend-pwd}
      BACKEND_ACCOUNT_API_OAUTH_TOKEN_ENDPOINT: ${BACKEND_ACCOUNT_API_OAUTH_TOKEN_ENDPOINT:-http://wiremock/oauth2/v2.0/token}
      BACKEND_ACCOUNT_API_OAUTH_SCOPE: ${BACKEND_ACCOUNT_API_OAUTH_SCOPE:-5300ba70-de1f-4f2e-a612-255fb00592f4/.default}
      # Mock auth is for local integration tests only (npm run integration:up / integration:ci).
      # Defaults to false so a plain `docker compose up` does not bypass real Azure AD B2C.
      ENABLE_MOCK_AUTH: ${ENABLE_MOCK_AUTH:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_CACHE_ENGINE: redis
      EPR_PACKAGING_HOME_URL: ${EPR_PACKAGING_HOME_URL:-https://localhost:7084/report-data}
      EPR_PACKAGING_MANAGE_ACCOUNT_URL: ${EPR_PACKAGING_MANAGE_ACCOUNT_URL:-https://localhost:7084/manage-account}
      EPR_PACKAGING_CLEAR_SESSION_URL: ${EPR_PACKAGING_CLEAR_SESSION_URL:-https://localhost:7084/report-data/Account/ClearSession}
      EPR_PACKAGING_SIGN_IN_URL: ${EPR_PACKAGING_SIGN_IN_URL:-https://localhost:7084/report-data/Account/SignIn}
      MANAGE_YOUR_RECYCLING_OBLIGATIONS_URL: ${MANAGE_YOUR_RECYCLING_OBLIGATIONS_URL:-https://localhost:7084/report-data/manage-your-recycling-obligations}
      SERVICE_FEEDBACK_URL: ${SERVICE_FEEDBACK_URL:-https://defragroup.eu.qualtrics.com/jfe/form/SV_e5HK8ijKACZGi1M}
      EPR_SUPPORT_EMAIL: ${EPR_SUPPORT_EMAIL:-eprcustomerservice@defra.gov.uk}
      EPR_SUPPORT_TELEPHONE: ${EPR_SUPPORT_TELEPHONE:-0300 060 0002}
      EPR_PRIVACY_URL: ${EPR_PRIVACY_URL:-https://www.gov.uk/guidance/extended-producer-responsibility-for-packaging-privacy-policy}
      EPR_ACCESSIBILITY_URL: ${EPR_ACCESSIBILITY_URL:-https://www.gov.uk/guidance/extended-producer-responsibility-for-packaging-accessibility-statement}
    networks:
      - cdp-tenant

  # your-backend:
