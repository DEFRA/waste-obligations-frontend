name: Publish Hot Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: CDP-build-hotfix-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0 # Depth 0 is required for branch-based versioning
      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: |
          npm ci
          npm run build:frontend
          npm run format:check
          npm run lint
          npm test

      - name: Test translation tooling and check exports are up to date
        run: |
          npm run translations:install
          npm run test:translations
          npm run translations:check
          npm --prefix scripts/translations run audit

      - name: Security audit
        run: npm run security-audit

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-node-frontend-template .
          exit $?

  publish:
    name: Publish hot fix
    needs: [build, integration-tests, journey-tests, sonarcloud-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the release tag.
      id-token: write # Authenticate to AWS using OIDC.
    env:
      AWS_REGION: eu-west-2
      AWS_ACCOUNT_ID: '094954420758'
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # Depth 0 is required for branch-based versioning
      - name: Publish Hot Fix
        uses: DEFRA/cdp-build-action/build-hotfix@dfb527d1bca7591fbbfd32ac007557745e888cf2 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run integration:install-browsers

      - name: Run integration tests
        run: npm run integration:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

      - name: Tear down integration stack
        if: always()
        run: npm run integration:down

  journey-tests:
    name: Run journey tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout hotfix code and release tags
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout journey-test main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DEFRA/waste-obligations-journey-tests
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: journey-tests-action

      - name: Checkout backend main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DEFRA/waste-obligations
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: hotfix-history/waste-obligations

      - name: Checkout proxy main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DEFRA/packaging-waste-proxy
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: hotfix-history/packaging-waste-proxy

      - name: Checkout Waste Organisations main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: DEFRA/waste-organisations
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: hotfix-history/waste-organisations

      - name: Resolve test stack for the base release
        id: journey-tests-ref
        shell: bash
        run: |
          # Keep subsequent hotfix prerelease tags from moving the baseline.
          base_tag=$(git tag --merged HEAD --sort=-version:refname | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ && !found { print; found=1 }')
          if [ -z "$base_tag" ]; then
            echo "::error::No stable release tag found in the hotfix history"
            exit 1
          fi
          release_time=$(git show -s --format=%cI "${base_tag}^{commit}")
          echo "Base release: $base_tag at $release_time"
          resolve_revision() {
            local history_path="$1" output_name="$2" revision
            # Exclude older feature commits that merged into main after the release.
            revision=$(git -C "$history_path" rev-list --first-parent -1 --before="$release_time" HEAD)
            if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::No $history_path revision found for release $base_tag at $release_time"
              exit 1
            fi
            echo "$history_path revision: $revision"
            echo "$output_name=$revision" >> "$GITHUB_OUTPUT"
          }
          resolve_revision journey-tests-action ref
          resolve_revision hotfix-history/waste-obligations backend
          resolve_revision hotfix-history/packaging-waste-proxy proxy
          resolve_revision hotfix-history/waste-organisations organisations

      - name: Resolve historical Waste Organisations image
        shell: bash
        env:
          ORGANISATIONS_REF: ${{ steps.journey-tests-ref.outputs.organisations }}
        run: |
          version=$(git -C hotfix-history/waste-organisations tag --merged "$ORGANISATIONS_REF" --sort=-version:refname | awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ && !found { print; found=1 }')
          if [ -z "$version" ]; then
            echo "::error::No published Waste Organisations release found in the selected history"
            exit 1
          fi
          image="defradigital/waste-organisations:$version"
          digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::No immutable image digest found for $image"
            exit 1
          fi
          echo "Waste Organisations image: $image@$digest"
          echo "WASTE_ORGANISATIONS_IMAGE=$image@$digest" >> "$GITHUB_ENV"

      - name: Checkout selected journey-test action
        shell: bash
        env:
          JOURNEY_TESTS_REF: ${{ steps.journey-tests-ref.outputs.ref }}
        run: git -C journey-tests-action checkout --detach "$JOURNEY_TESTS_REF"

      - name: Run journey profiles
        uses: ./journey-tests-action/run-journey-tests
        with:
          journey-tests-ref: ${{ steps.journey-tests-ref.outputs.ref }}
          waste-obligations: ${{ steps.journey-tests-ref.outputs.backend }}
          waste-obligations-frontend: ${{ github.sha }}
          packaging-waste-proxy: ${{ steps.journey-tests-ref.outputs.proxy }}
        env:
          EPR_USER_EMAIL: ${{ secrets.EPR_USER_EMAIL }}
          EPR_USER_PASSWORD: ${{ secrets.EPR_USER_PASSWORD }}
          EPR_CSO_USER_EMAIL: ${{ secrets.EPR_CSO_USER_EMAIL }}
          EPR_CSO_USER_PASSWORD: ${{ secrets.EPR_CSO_USER_PASSWORD }}
          WASTE_OBLIGATION_ORG_ID: e2316c5e-d434-41da-8274-494dc0762d20
          WASTE_OBLIGATION_CSO_ORG_ID: d93376e3-0681-46be-aeb4-7450a2e784d8
          WASTE_OBLIGATION_SUBMITTER_ID: 98b1e75b-5f36-4d0e-91ae-84fe9b6ce794
          WASTE_OBLIGATION_SUBMITTER_EMAIL: submitter@example.com
          WASTE_OBLIGATIONS_FRONTEND_B2C_CLIENT_SECRET: ${{ secrets.WASTE_OBLIGATIONS_FRONTEND_B2C_CLIENT_SECRET }}
          GOVUK_NOTIFY_API_KEY: ${{ secrets.GOVUK_NOTIFY_API_KEY }}

  sonarcloud-scan:
    name: CDP SonarCloud Scan
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/sonarcloud.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
