version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    # Group packages into shared PR
    groups:
      hapi:
        applies-to: version-updates
        patterns:
          - '@hapi/*'
        update-types:
          - 'minor'
          - 'patch'
      defra:
        applies-to: version-updates
        patterns:
          - '@defra/*'
        exclude-patterns:
          - '@defra/hapi-connect'
        update-types:
          - 'minor'
          - 'patch'
      testing:
        applies-to: version-updates
        patterns:
          - '@playwright/test'
          - '@vitest/*'
          - 'vitest'
          - 'vitest-*'
          - '@defra/hapi-connect'
        update-types:
          - 'minor'
          - 'patch'
      build:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '@babel/*'
          - 'autoprefixer'
          - 'babel-plugin-module-resolver'
          - 'babel-loader'
          - 'babel-plugin-transform-import-meta'
          - 'tsx'
          - 'webpack'
          - 'webpack-*'
          - 'terser-webpack-plugin'

      lint:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - 'prettier'
          - 'stylelint'
          - 'stylelint-*'

      logging:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*-pino'
          - '*-pino-format'
          - 'pino'
          - 'pino-*'

      tools:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - 'husky'
          - 'vitest'
          - 'vitest-*'
          - 'nodemon'
          - 'npm-run-all'
          - 'lodash'
          - 'source-map-loader'
          - 'sass-*'
          - 'postcss-*'

      types:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '@types/*'

    ignore:
      - dependency-name: 'eslint-*'
      - dependency-name: 'eslint'

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'

    versioning-strategy: increase

    allow:
      # Include direct package.json updates
      - dependency-type: direct

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    # Schedule run every Monday, local time
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'

  - package-ecosystem: docker-compose
    directories:
      - /
      - /compose
    ignore:
      # Keep Mongo on its existing major version while allowing minor and patch updates.
      - dependency-name: 'mongo'
        update-types:
          - 'version-update:semver-major'
    schedule:
      interval: weekly
      time: '10:30'
      timezone: 'Europe/London'
