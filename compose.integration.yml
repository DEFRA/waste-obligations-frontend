services:
  redis:
    image: redis:7.2.3-alpine3.18@sha256:3ce533b2b057f74b235d1d8697ae08b1b6ff0a5e16827ea6a377b6365693c7ed
    ports:
      - '6379:6379'
    restart: always
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - integration

  wiremock:
    pull_policy: missing
    image: sheyenrath/wiremock.net:latest@sha256:3d31cf7a0b5ad8062c9ae1ba36e2355f4b034102bd980217d5003da5effd0e10
    ports:
      - '9080:80'
    volumes:
      - ./compose/wiremock/mappings:/app/__admin/mappings
    command:
      [
        '--ReadStaticMappings',
        'true',
        '--WatchStaticMappingsInSubdirectories',
        'true',
        '--WireMockLogger',
        'WireMockConsoleLogger'
      ]
    networks:
      - integration

  waste-obligations-frontend:
    build:
      context: ./
      target: integration
    command: ['node', 'test-helpers/start-integration-server.js']
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      wiremock:
        condition: service_started
    environment:
      PORT: 3000
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_TLS: 'false'
      USE_SINGLE_INSTANCE_CACHE: 'true'
      WASTE_ORGANISATIONS_API_BASE_URL: http://wiremock
      WASTE_ORGANISATIONS_API_AUTH_MODE: basic
      WASTE_ORGANISATIONS_API_CLIENT_ID: Developer
      WASTE_ORGANISATIONS_API_CLIENT_SECRET: developer-pwd
      WASTE_OBLIGATIONS_API_BASE_URL: http://wiremock
      WASTE_OBLIGATIONS_API_AUTH_MODE: basic
      WASTE_OBLIGATIONS_API_CLIENT_ID: Developer
      WASTE_OBLIGATIONS_API_CLIENT_SECRET: developer-pwd
      BACKEND_ACCOUNT_API_BASE_URL: http://wiremock/api/
      BACKEND_ACCOUNT_API_AUTH_MODE: bearer
      BACKEND_ACCOUNT_API_OAUTH_CLIENT_ID: waste-obligations-frontend
      BACKEND_ACCOUNT_API_OAUTH_CLIENT_SECRET: waste-obligations-frontend-pwd
      BACKEND_ACCOUNT_API_OAUTH_TOKEN_ENDPOINT: http://wiremock/oauth2/v2.0/token
      BACKEND_ACCOUNT_API_OAUTH_SCOPE: 5300ba70-de1f-4f2e-a612-255fb00592f4/.default
      AUTH_ALLOWED_HOSTS: localhost
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_CACHE_ENGINE: redis
      FEATURE_MANAGE_OBLIGATIONS: 'true'
      FEATURE_SHOW_PRNS: 'true'
    networks:
      - integration

  waste-obligations-frontend-proxy:
    image: nginx:1.31-alpine@sha256:62ff2089abf5a9ed33bd232895bef5e22f7bb4b200675cec49a5ebc48e3d4ac8
    ports:
      - '3001:80'
    volumes:
      - ./compose/nginx/integration-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q --spider http://127.0.0.1/manage-recycling-obligations/health'
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      waste-obligations-frontend:
        condition: service_healthy
    networks:
      - integration

networks:
  integration:
    driver: bridge
